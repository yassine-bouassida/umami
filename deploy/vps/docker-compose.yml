---
# Umami on the Hostinger VPS, using the image .github/workflows/vps-image.yml builds from this fork.
# Secrets come from the project's environment (see .env.example), never from this file.
services:
  umami:
    image: ghcr.io/yassine-bouassida/umami:${UMAMI_IMAGE_TAG:-master}
    environment:
      DATABASE_URL: postgresql://umami:${POSTGRES_PASSWORD}@db:5432/umami
      APP_SECRET: ${APP_SECRET}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY}
      # Serves the read-only MCP endpoint at /mcp (needs an Umami API key)
      MCP_ENABLED: "1"
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  # Deletes session recordings and heatmap data after 30 days, on start and then daily.
  # A saved replay is only a label on a recording, so it goes when the recording does.
  # Page views and events are kept.
  retention:
    image: postgres:15-alpine
    environment:
      PGHOST: db
      PGUSER: umami
      PGDATABASE: umami
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command:
      - sh
      - -c
      - |
        while true; do
          echo "retention run $$(date -u +%FT%TZ)"
          psql -v ON_ERROR_STOP=1 <<'SQL' || echo "retention run FAILED"
        BEGIN;
        DELETE FROM session_replay WHERE coalesce(created_at, ended_at) < now() - interval '30 days';
        DELETE FROM heatmap_event WHERE created_at < now() - interval '30 days';
        DELETE FROM session_replay_saved s WHERE NOT EXISTS (
          SELECT 1 FROM session_replay r WHERE r.website_id = s.website_id AND r.visit_id = s.visit_id
        );
        COMMIT;
        SQL
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy
    restart: always
  # HTTPS in front of Umami; Caddy gets and renews a certificate for each host in UMAMI_HOST.
  # The Caddyfile is generated at start because Hostinger's Docker manager can't mount files.
  caddy:
    image: caddy:2
    environment:
      UMAMI_HOST: ${UMAMI_HOST}
    command:
      - sh
      - -c
      - printf '%s {\n\treverse_proxy umami:3000\n}\n' "$$UMAMI_HOST" > /etc/caddy/Caddyfile && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - umami
    restart: always
volumes:
  umami-db-data:
  caddy-data:
  caddy-config:
